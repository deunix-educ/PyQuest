<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#0f766e">
        <title>PyQuest</title>
        <link rel="manifest" href="manifest.webmanifest">
        <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
        <link rel="apple-touch-icon" href="icons/icon-180.png">
        <link rel="stylesheet" href="css/themes.css">
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/cells.css">
        <link rel="stylesheet" href="css/guide.css">
        <link rel="stylesheet" href="css/progress.css">
    </head>
    <body>
        <a class="skip-link" href="#main">Aller au contenu / Skip to content</a>
        <div id="app-root">
            <header class="app-header">
                <button type="button" class="btn" id="levels-toggle"></button>
                <div class="app-heading">
                    <div class="brand">
                        <img src="icons/icon.svg" alt="" width="32" height="32">
                        <h1 id="app-title">PyQuest</h1>
                    </div>
                    <nav class="level-nav" id="level-nav">
                        <button type="button" class="btn" id="level-prev"><span aria-hidden="true">‹</span></button>
                        <span class="level-current" id="level-current"></span>
                        <button type="button" class="btn" id="level-next"><span aria-hidden="true">›</span></button>
                    </nav>
                </div>
                <button type="button" class="btn" id="settings-toggle"></button>
            </header>
            <div id="notebook-region"></div>
        </div>
        <div id="drawer-region"></div>
        <div id="toast-region"></div>
        <noscript>PyQuest a besoin de JavaScript. / PyQuest needs JavaScript.</noscript>
        <script type="module" src="js/main.js"></script>
    </body>
</html>
