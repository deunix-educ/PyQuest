<!doctype html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{{ t.title }}</title>
    <style>
        :root { color-scheme: light dark; }
        body { font-family: system-ui, sans-serif; max-width: 26rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.5; }
        label { display: block; margin-top: 1rem; font-weight: 700; }
        input[type=text], input[type=password] { width: 100%; box-sizing: border-box; padding: 0.6rem; font: inherit; min-height: 2.75rem; }
        button, .button { margin-top: 1.25rem; padding: 0.6rem 1.2rem; font: inherit; min-height: 2.75rem; cursor: pointer; }
        .error { margin-top: 1rem; padding: 0.75rem; border: 2px solid #b3261e; border-radius: 0.4rem; }
        .error::before { content: "✘ "; }
        :focus-visible { outline: 3px solid #1a73e8; outline-offset: 2px; }
    </style>
</head>
<body>
    <main>
        <h1>{{ t.heading }}</h1>
        {% if signed_in %}
            <p role="status">{{ signed_in_text }}</p>
            <p><a class="button" href="{{ next }}">{{ t.open }}</a></p>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">{{ t.logout }}</button>
            </form>
        {% else %}
            {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <label for="username">{{ t.username }}</label>
                <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                <label for="password">{{ t.password }}</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">{{ t.submit }}</button>
            </form>
        {% endif %}
    </main>
</body>
</html>
