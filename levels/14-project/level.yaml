                    name, value = line.split()
                    moves.append((name, int(value)))
            return moves


        def replay(moves, pencil):
            # À compléter : pour chaque (name, value), appelle forward ou turn
            pass


        # 1. Dessine un triangle bleu et sauvegarde-le
        pencil = Pencil("blue")
        for _ in range(3):
            pencil.forward(100)
            pencil.turn(120)
        save_moves(pencil.moves, "data/triangle.txt")

        # 2. Efface la feuille, recharge le fichier et redessine
        canvas.clear()
