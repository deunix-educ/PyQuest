    tests:
        - kind: drawing_segments
          value: "3"
          message:
              fr: "La feuille doit montrer exactement 3 traits : efface-la avant de redessiner (canvas.clear) et rejoue les mouvements."
              en: "The sheet must show exactly 3 lines: clear it before redrawing (canvas.clear) and replay the moves."
        - kind: drawing_has_line
          value: "0,0 100,0 blue"
          message:
              fr: "Le premier côté du triangle bleu doit être redessiné de (0, 0) à (100, 0)."
              en: "The first side of the blue triangle must be redrawn from (0, 0) to (100, 0)."
        - kind: drawing_has_line
          value: "100,0 50,86.6 blue"
        - kind: drawing_has_line
          value: "50,86.6 0,0 blue"
          message:
              fr: "Le triangle doit se refermer sur le point de départ."
              en: "The triangle must close back on the starting point."
        - kind: stdout_equals
          value: "6 mouvements rechargés\n"
          message:
              fr: "Il faut afficher exactement 6 mouvements rechargés."
              en: "It must show exactly 6 mouvements rechargés."
        - kind: code_contains
          value: len(moves)
          message:
              fr: "Compte les mouvements avec len(moves)."
              en: "Count the moves with len(moves)."
    solution: |
        import math
        import canvas


        class Pencil:
            def __init__(self, color="black"):
                self.x = 0
                self.y = 0
                self.angle = 0
                self.color = color
                self.moves = []

            def turn(self, degrees):
                self.angle += degrees
                self.moves.append(("turn", degrees))

            def forward(self, distance):
                new_x = self.x + distance * math.cos(math.radians(self.angle))
                new_y = self.y + distance * math.sin(math.radians(self.angle))
                canvas.line(self.x, self.y, new_x, new_y, self.color)
                self.x = new_x
                self.y = new_y
                self.moves.append(("forward", distance))


        def save_moves(moves, path):
            with open(path, "w") as file:
                for name, value in moves:
                    file.write(f"{name} {value}\n")


        def load_moves(path):
            moves = []
            with open(path) as file:
                for line in file:
                    name, value = line.split()
                    moves.append((name, int(value)))
            return moves


        def replay(moves, pencil):
            for name, value in moves:
                if name == "forward":
                    pencil.forward(value)
                else:
                    pencil.turn(value)


        pencil = Pencil("blue")
        for _ in range(3):
            pencil.forward(100)
            pencil.turn(120)
        save_moves(pencil.moves, "data/triangle.txt")

        canvas.clear()
        moves = load_moves("data/triangle.txt")
        new_pencil = Pencil("blue")
        replay(moves, new_pencil)
        print(len(moves), "mouvements rechargés")
    reward_sound: level_unlocked
